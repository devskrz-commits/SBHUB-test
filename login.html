<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Vibrant background gradient matching the reference */
            background: linear-gradient(135deg, #ff3366, #7928ca, #0070f3);
            background-size: 200% 200%;
            animation: gradientShift 10s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Decorative Background Elements / Orbs */
        .background-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            z-index: 1;
        }

        .blob-1 {
            width: 200px;
            height: 200px;
            background: rgba(0, 229, 255, 0.5);
            top: 15%;
            left: 20%;
        }

        .blob-2 {
            width: 250px;
            height: 250px;
            background: rgba(0, 112, 243, 0.4);
            bottom: 15%;
            right: 15%;
        }

        /* Glassmorphism Card Container */
        .login-card {
            position: relative;
            z-index: 2;
            width: 380px;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 24px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            
            /* Fast-start, slow-settle pop up side animation */
            opacity: 0;
            transform: translateX(100px);
            animation: sidePopUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            animation-delay: 0.2s;
        }

        @keyframes sidePopUp {
            0% {
                opacity: 0;
                transform: translateX(120px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        .login-card h2 {
            color: #ffffff;
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            outline: none;
            color: #ffffff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .password-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .forgot-link {
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px;
            text-decoration: none;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: #ffffff;
        }

        .options-row {
            display: flex;
            align-items: center;
            margin: 15px 0 20px 0;
            color: rgba(255, 255, 255, 0.9);
            font-size: 13px;
        }

        .options-row input[type="checkbox"] {
            margin-right: 8px;
            accent-color: #ffcc00;
            width: 16px;
            height: 16px;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #ffcc00;
            border: none;
            border-radius: 14px;
            color: #1a1a1a;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 204, 0, 0.3);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .login-btn:hover {
            background: #ffd633;
            transform: translateY(-2px);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
        }

        .footer-text a {
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
            margin-left: 4px;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Background glowing visual shapes -->
    <div class="background-blob blob-1"></div>
    <div class="background-blob blob-2"></div>

    <!-- Main Glass Login Box -->
    <div class="login-card">
        <h2>Login</h2>
        
        <form>
            <div class="input-group">
                <label>Username or email</label>
                <input type="text" placeholder="Enter your email">
            </div>

            <div class="input-group">
                <div class="password-row">
                    <label>Password</label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>
                <input type="password" placeholder="••••••••">
            </div>

            <div class="options-row">
                <input type="checkbox" id="remember">
                <label for="remember" style="margin-bottom:0; cursor:pointer;">Remember me</label>
            </div>

            <button type="submit" class="login-btn">Login</button>

            <div class="footer-text">
                Don't have an account?<a href="#">Sign up</a>
            </div>
        </form>
    </div>

</body>
</html>
