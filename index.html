<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marcus Huntington - Basketball Player Profile</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  
  <!-- Project Stylesheet -->
  <link rel="stylesheet" href="./styles.css">

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  
  <!-- Project App JS -->
  <script src="./app.js" defer></script>
</head>
<body id="pageBody">

  <!-- MAIN OUTER PROFILE WRAPPER -->
  <div class="app-viewport">
    <div class="dashboard-card">

      <!-- TOP HEADER / NAV BAR -->
      <header class="dashboard-header">
        <div class="brand-logo">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <path d="M4 4H14V14H4V4Z" stroke="white" stroke-width="3" stroke-linejoin="round"/>
            <path d="M14 14H24V24H14V24Z" stroke="white" stroke-width="3" stroke-linejoin="round"/>
            <path d="M14 4V24" stroke="white" stroke-width="3"/>
          </svg>
        </div>

        <div class="header-center-nav">
          <div class="nav-pill-group">
            <button class="nav-icon-btn active" title="Overview"><i class="bx bx-file"></i></button>
            <button class="nav-icon-btn" title="Roster"><i class="bx bx-group"></i></button>
            <button class="nav-icon-btn" title="Stats"><i class="bx bx-run"></i></button>
            <button class="nav-icon-btn" title="Schedule"><i class="bx bx-basketball"></i></button>
            <button class="nav-icon-btn" title="Analytics"><i class="bx bx-bar-chart-alt-2"></i></button>
          </div>
        </div>

        <div class="header-right-tools">
          <div class="search-input-wrap">
            <i class="bx bx-search"></i>
            <input type="text" id="playerSearchInput" placeholder="Search.." autocomplete="off">
          </div>
          <div class="user-avatar-pill">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80" alt="User Profile">
          </div>
        </div>
      </header>

      <!-- UPPER HERO / STATS SECTION -->
      <div class="hero-section">

        <!-- OVERLAPPING BASKETBALL PLAYER IMAGE -->
        <div class="player-cutout-container">
          <div class="player-shadow"></div>
          <img src="https://images.unsplash.com/photo-1546519638-68e109498ffc?auto=format&fit=crop&w=900&q=80" id="playerHeroImg" alt="Basketball Player" class="player-hero-img">
        </div>

        <!-- CENTER SPIDER/RADAR CHART WITH STAT CALLOUTS -->
        <div class="spider-chart-stage">
          <div class="jersey-bg-number">23</div>
          
          <!-- SVG Radar Chart Graphic -->
          <svg class="radar-svg" viewBox="0 0 320 280">
            <!-- Axis lines -->
            <polygon points="160,30 270,95 240,210 80,210 50,95" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
            <polygon points="160,65 235,110 215,190 105,190 85,110" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
            <polygon points="160,100 200,125 190,170 130,170 120,125" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
            
            <line x1="160" y1="140" x2="160" y2="30" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
            <line x1="160" y1="140" x2="270" y2="95" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
            <line x1="160" y1="140" x2="240" y2="210" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
            <line x1="160" y1="140" x2="80" y2="210" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
            <line x1="160" y1="140" x2="50" y2="95" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

            <!-- Active Stat Polygon -->
            <polygon points="160,42 265,102 232,200 95,195 58,105" fill="rgba(239, 68, 68, 0.15)" stroke="#f43f5e" stroke-width="2.5" stroke-linejoin="round" />
            
            <!-- Nodes -->
            <circle cx="160" cy="42" r="4" fill="#f43f5e" />
            <circle cx="265" cy="102" r="4" fill="#f43f5e" />
            <circle cx="232" cy="200" r="4" fill="#f43f5e" />
            <circle cx="95" cy="195" r="4" fill="#f43f5e" />
            <circle cx="58" cy="105" r="4" fill="#f43f5e" />
          </svg>

          <!-- Stat Node Labels Positioned Around Chart -->
          <div class="stat-node node-ppg">
            <span class="node-label">PPG</span>
            <span class="node-val" id="valPPG">29.1</span>
          </div>
          <div class="stat-node node-apg">
            <span class="node-label">APG</span>
            <span class="node-val" id="valAPG">10.3</span>
          </div>
          <div class="stat-node node-fg">
            <span class="node-label">FG%</span>
            <span class="node-val" id="valFG">57.5</span>
          </div>
          <div class="stat-node node-3p">
            <span class="node-label">3P%</span>
            <span class="node-val" id="val3P">41.0</span>
          </div>
          <div class="stat-node node-rpg">
            <span class="node-label">RPG</span>
            <span class="node-val" id="valRPG">24.6</span>
          </div>
        </div>

        <!-- RIGHT SIDE PLAYER METRICS BLOCK -->
        <div class="player-info-column">
          
          <div class="player-title-box">
            <h1 class="player-name-text" id="playerName">Marcus<br>Huntington</h1>
            <div class="player-team-row">
              <div class="team-shield-icon">
                <i class="bx bxs-shield-alt-2"></i>
              </div>
              <span class="team-name-text" id="playerTeam">Liberty Deer</span>
            </div>
          </div>

          <!-- TOP 3 METRIC CARDS (WINS, LOSSES, WINNING %) -->
          <div class="top-stats-row">
            <div class="metric-card card-orange">
              <i class="bx bx-trophy card-icon"></i>
              <span class="metric-label">Wins</span>
              <span class="metric-value" id="statWins">84</span>
            </div>
            <div class="metric-card card-purple">
              <i class="bx bx-basketball card-icon"></i>
              <span class="metric-label">Losses</span>
              <span class="metric-value" id="statLosses">18</span>
            </div>
            <div class="metric-card card-white">
              <i class="bx bx-star card-icon"></i>
              <span class="metric-label">Winning %</span>
              <span class="metric-value" id="statWinRate">82.3%</span>
            </div>
          </div>

          <!-- BOTTOM 2x2 SPEC CARDS (HEIGHT, WEIGHT, AGE, COUNTRY) -->
          <div class="specs-grid">
            <div class="spec-card">
              <span class="spec-label">Height</span>
              <span class="spec-val" id="specHeight">2.06 m</span>
            </div>
            <div class="spec-card">
              <span class="spec-label">Weight</span>
              <span class="spec-val" id="specWeight">113 kg</span>
            </div>
            <div class="spec-card">
              <span class="spec-label">Age</span>
              <span class="spec-val" id="specAge">40 years</span>
            </div>
            <div class="spec-card">
              <span class="spec-label">Country</span>
              <span class="spec-val" id="specCountry">🇺🇸 USA</span>
            </div>
          </div>

        </div>
      </div>

      <!-- LOWER DATA SECTION (TABLE & LIVE CARDS) -->
      <div class="lower-section-grid">
        
        <!-- LEFT GAMES TABLE PANEL -->
        <div class="games-panel">
          <div class="panel-header-row">
            <h2 class="panel-title">Games Stats</h2>
            <div class="panel-filter-dropdown">
              <span>By Date</span>
              <i class="bx bx-chevron-down"></i>
            </div>
          </div>

          <div class="table-container">
            <table class="games-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Match</th>
                  <th>Final Score</th>
                  <th>Result</th>
                  <th>PTS</th>
                  <th>REB</th>
                  <th>AST</th>
                  <th>FG%</th>
                </tr>
              </thead>
              <tbody id="gamesTableBody">
                <!-- Dynamically populated from JS -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- RIGHT UPCOMING / LIVE GAMES SIDEBAR -->
        <div class="upcoming-panel">
          <div class="upcoming-tabs-row">
            <button class="tab-btn active">Live <span class="live-dot"></span></button>
            <button class="tab-btn">Yesterday</button>
            <button class="tab-btn">Today</button>
            <button class="tab-btn">Upcoming</button>
            <button class="tab-btn">Archived</button>
          </div>

          <div class="match-cards-column" id="matchCardsContainer">
            <!-- Dynamically populated from JS -->
          </div>
        </div>

      </div>

    </div>
  </div>

</body>
</html>
