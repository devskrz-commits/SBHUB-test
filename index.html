<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sportsbook Hub - Secured Dashboard</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- Toast Notification -->
  <div id="toastNotification">
    <i class='bx bx-info-circle' style="font-size: 16px; color: var(--accent-glow);"></i> 
    <span id="toastMsg">Notification</span>
  </div>

  <!-- Authentication Overlay -->
  <div id="authOverlay">
    <div class="lamp-login-container">
      <div class="lamp-scene">
        <div class="lamp-light-beam"></div>
        <div class="lamp-shade"></div>
        
        <!-- Clean Pull Cord Target -->
        <div class="pull-cord-wrapper" id="pullCord" onclick="toggleLamp(event)" title="Pull Lamp Cord">
          <div class="cord-string"></div>
          <div class="cord-handle"></div>
        </div>
        
        <div class="lamp-stand-rod"></div>
        <div class="lamp-base"></div>
      </div>
      <div class="login-popup-card">
        <div class="login-title">Sportsbook Hub</div>
        <div class="input-group">
          <label class="input-label">Username</label>
          <input type="text" id="loginUsername" class="login-input" value="sportsbookhub" readonly>
        </div>
        <div class="input-group">
          <label class="input-label">Password</label>
          <input type="password" id="loginPassword" class="login-input" placeholder="Enter password" onkeydown="if(event.key==='Enter') verifyLogin()">
        </div>
        <label class="remember-container">
          <input type="checkbox" id="rememberMeCheckbox">
          <span class="remember-label">Remember Me</span>
        </label>
        <button class="signin-btn" onclick="verifyLogin()">Sign In</button>
        <div class="error-msg" id="loginError"></div>
      </div>
    </div>
  </div>

  <div id="mobileBackdropOverlay" onclick="closeMobileSidebar()"></div>

  <!-- Floating Liquid Pill Sidebar -->
  <div class="sidebar" id="mainSidebar" title="Right-click to Lock / Unlock Position">
    <div class="logo-details" id="sidebarDragHandle" title="Drag Sidebar Here" style="display:none;">
      <div class="logo_name">SPORTSBOOK HUB</div>
      <i class='bx bx-x' id="closeSidebarBtn" style="font-size:24px; cursor:pointer;" onclick="closeMobileSidebar()"></i>
    </div>
    
    <div class="sidebar-top-section">
      <div class="search-box">
        <i class='bx bx-search'></i>
        <input type="text" id="searchInput" placeholder="Search..." onkeyup="handleSearch()">
      </div>
    </div>
      
    <ul class="nav-list" id="navList"></ul>
      
    <div class="sidebar-customization-panel">
      <!-- ACCORDION 1: GLASS OPACITY & ACCENT PALETTE -->
      <div>
        <div class="custom-control-label" style="cursor: pointer; user-select: none;" onclick="toggleAccordion('glassAccentContainer', 'glassChevron')">
          <span>🎛️ Glass & Color</span>
          <i class='bx bx-chevron-down' id="glassChevron" style="font-size: 14px; transition: transform 0.25s ease;"></i>
        </div>
        <div id="glassAccentContainer" style="display: none; flex-direction: column; gap: 8px; margin-top: 6px;">
          <div>
            <div class="custom-control-label" style="font-size: 8.5px; color: var(--text-sub);">
              <span>OPACITY</span>
              <span id="opacityValLabel" style="font-family: var(--font-mono);">30%</span>
            </div>
            <div class="custom-slider-wrapper" style="margin-top: 4px;">
              <input type="range" id="opacitySlider" class="styled-slider" min="5" max="90" value="30" oninput="updateGlassOpacity(this.value)">
            </div>
          </div>
          <div>
            <div class="custom-control-label" style="font-size: 8.5px; color: var(--text-sub);">ACCENT</div>
            <div class="color-swatch-container">
              <div class="color-swatch active" style="background-color: #38bdf8;" onclick="setAccentColor('#38bdf8', this)" title="Sky Blue"></div>
              <div class="color-swatch" style="background-color: #a855f7;" onclick="setAccentColor('#a855f7', this)" title="Neon Purple"></div>
              <div class="color-swatch" style="background-color: #34d399;" onclick="setAccentColor('#34d399', this)" title="Emerald Green"></div>
              <div class="color-swatch" style="background-color: #f59e0b;" onclick="setAccentColor('#f59e0b', this)" title="Amber Gold"></div>
              <div class="color-swatch" style="background-color: #ec4899;" onclick="setAccentColor('#ec4899', this)" title="Hot Pink"></div>
              <div class="color-swatch" style="background-color: #ffffff;" onclick="setAccentColor('#ffffff', this)" title="Pure White"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- ACCORDION 2: BACKGROUND GALLERY & UPLOAD -->
      <div style="border-top: 1px solid var(--item-border); padding-top: 6px;">
        <div class="custom-control-label" style="cursor: pointer; user-select: none;" onclick="toggleAccordion('wallpaperContainer', 'wpChevron')">
          <span>🖼️ Wallpapers</span>
          <i class='bx bx-chevron-down' id="wpChevron" style="font-size: 14px; transition: transform 0.25s ease;"></i>
        </div>
        <div id="wallpaperContainer" style="display: none; flex-direction: column; gap: 4px; margin-top: 6px;">
          <div class="wallpaper-thumbnail-grid" id="wallpaperPickerContainer"></div>
          <input type="file" id="customBgUpload" accept="image/*" style="display:none;" onchange="handleCustomBgUpload(event)">
          <button type="button" class="upload-bg-btn" onclick="document.getElementById('customBgUpload').click()">
            <i class='bx bx-cloud-upload'></i> Upload BG
          </button>
        </div>
      </div>

      <!-- ACCORDION 3: MANAGE WIDGETS CONTROL PANEL -->
      <div style="border-top: 1px solid var(--item-border); padding-top: 6px;">
        <div class="custom-control-label" style="cursor: pointer; user-select: none;" onclick="toggleAccordion('widgetManagerContainer', 'manageWidgetsChevron')">
          <span>⚙️ Widgets</span>
          <i class='bx bx-chevron-down' id="manageWidgetsChevron" style="font-size: 14px; transition: transform 0.25s ease;"></i>
        </div>
        <div id="widgetManagerContainer" style="display: none; flex-direction: column; gap: 4px; margin-top: 6px;"></div>
      </div>
    </div>

    <!-- Floating Pill Profile Card at Bottom -->
    <div class="profile">
      <div class="profile-details">
        <div style="font-size: 16px;">👤</div>
        <div class="name_job">
          <div class="name">ADMIN</div>
          <div class="job">Devorin</div>
        </div>
      </div>
      <i class='bx bx-cog' id="settings_btn" style="cursor: pointer; font-size: 18px;" onclick="handleNavClick(null, toggleModal)"></i>
    </div>
  </div>

  <!-- Main Workspace -->
  <div class="main-workspace" id="workspace">
    <!-- Widgets Container -->
  </div>

  <!-- Mobile Floating Navigation Dock -->
  <div class="mobile-nav-bar">
    <div class="mobile-nav-item active" id="navHomeBtn" onclick="handleNavClick(this, () => window.scrollTo({top:0, behavior:'smooth'}))" title="Home"><i class='bx bx-home-alt'></i></div>
    <div class="mobile-nav-item" id="navMenuBtn" onclick="handleNavClick(this, toggleMobileSidebar)" title="Menu"><i class='bx bx-category-alt'></i></div>
    <div class="mobile-nav-item" id="navDockBtn" onclick="handleNavClick(this, () => document.getElementById('quickDockCard')?.scrollIntoView({behavior:'smooth'}))" title="Quick Links"><i class='bx bx-rocket'></i></div>
    <div class="mobile-nav-item" id="navSettingsBtn" onclick="handleNavClick(this, toggleModal)" title="Settings"><i class='bx bx-cog'></i></div>
  </div>

  <!-- Settings Modal -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <div class="card-header-title">
        <span>SETTINGS & DATA LOG</span>
        <i class='bx bx-x' style="cursor:pointer; font-size: 22px;" onclick="toggleModal()"></i>
      </div>
      <button class="action-btn logout-btn" onclick="triggerLogout()" style="margin-top: 15px;"><i class='bx bx-log-out'></i> LOGOUT NOW</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
