<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marcus Huntington - Basketball Profile</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>

  <div class="app-viewport">
    <main class="dashboard-card">

      <!-- REAL ATHLETE CUTOUT HOLDING BASKETBALL OVERLAPPING LEFT -->
      <div class="player-cutout-container">
        <img 
          src="https://images.unsplash.com/photo-1546519638-68e109498ffc?auto=format&fit=crop&w=1000&q=80" 
          alt="Basketball Player" 
          class="player-cutout-img"
          id="playerHeroImg"
        >
      </div>

      <!-- HEADER NAVIGATION BAR -->
      <header class="header-nav">
        <div class="brand-logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
            <path d="M14 3h7v7"/>
            <path d="M3 14h7v7"/>
          </svg>
        </div>

        <div class="center-pill-nav">
          <button class="pill-btn"><i class="bx bx-file-blank"></i></button>
          <button class="pill-btn"><i class="bx bx-group"></i></button>
          <button class="pill-btn active"><i class="bx bx-run"></i></button>
          <button class="pill-btn"><i class="bx bx-basketball"></i></button>
          <button class="pill-btn"><i class="bx bx-slider-alt"></i></button>
        </div>

        <div class="right-header-tools">
          <div class="search-box">
            <i class="bx bx-search"></i>
            <input type="text" id="searchInput" placeholder="Search..">
          </div>
          <div class="profile-avatar">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80" alt="Avatar">
          </div>
        </div>
      </header>

      <!-- UPPER HERO CONTENT GRID -->
      <section class="hero-content-grid">
        <!-- Spacer for left player position -->
        <div class="left-player-spacer"></div>

        <!-- CENTER SPIDER CHART & WATERMARK 23 -->
        <div class="spider-chart-stage">
          <div class="jersey-watermark">23</div>

          <svg class="radar-svg" viewBox="0 0 300 260">
            <polygon points="150,20 255,80 230,195 70,195 45,80" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
            <polygon points="150,55 220,95 203,170 97,170 80,95" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
            <polygon points="150,90 185,110 176,145 124,145 115,110" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

            <line x1="150" y1="120" x2="150" y2="20" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
            <line x1="150" y1="120" x2="255" y2="80" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
            <line x1="150" y1="120" x2="230" y2="195" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
            <line x1="150" y1="120" x2="70" y2="195" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
            <line x1="150" y1="120" x2="45" y2="80" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

            <polygon points="150,32 250,88 220,185 85,180 52,90" fill="rgba(239, 68, 68, 0.22)" stroke="#ef4444" stroke-width="2.5" stroke-linejoin="round"/>

            <circle cx="150" cy="32" r="4" fill="#ef4444"/>
            <circle cx="250" cy="88" r="4" fill="#ef4444"/>
            <circle cx="220" cy="185" r="4" fill="#ef4444"/>
            <circle cx="85" cy="180" r="4" fill="#ef4444"/>
            <circle cx="52" cy="90" r="4" fill="#ef4444"/>
          </svg>

          <div class="stat-tag tag-ppg"><span class="lbl">PPG</span><span class="val">29.1</span></div>
          <div class="stat-tag tag-apg"><span class="lbl">APG</span><span class="val">10.3</span></div>
          <div class="stat-tag tag-fg"><span class="lbl">FG%</span><span class="val">57.5</span></div>
          <div class="stat-tag tag-3p"><span class="lbl">3P%</span><span class="val">41.0</span></div>
          <div class="stat-tag tag-rpg"><span class="lbl">RPG</span><span class="val">24.6</span></div>
        </div>

        <!-- RIGHT SIDE PLAYER DETAILS & METRICS -->
        <div class="player-profile-side">
          <div class="player-name-block">
            <h1 class="player-title" id="playerName">Marcus<br>Huntington</h1>
            <div class="team-tag">
              <i class="bx bxs-shield-alt-2"></i>
              <span id="playerTeam">Liberty Deer</span>
            </div>
          </div>

          <!-- TOP 3 STAT CARDS -->
          <div class="metrics-cards-row">
            <div class="stat-card card-orange">
              <i class="bx bx-trophy card-icon"></i>
              <span class="card-label">Wins</span>
              <span class="card-val" id="statWins">84</span>
            </div>
            <div class="stat-card card-glass">
              <i class="bx bx-basketball card-icon"></i>
              <span class="card-label">Losses</span>
              <span class="card-val" id="statLosses">18</span>
            </div>
            <div class="stat-card card-white">
              <i class="bx bx-star card-icon"></i>
              <span class="card-label">Winning %</span>
              <span class="card-val" id="statWinRate">82.3%</span>
            </div>
          </div>

          <!-- 2x2 SPECIFICATIONS GRID -->
          <div class="specs-grid-2x2">
            <div class="spec-box">
              <span class="spec-lbl">Height</span>
              <span class="spec-val" id="specHeight">2.06 m</span>
            </div>
            <div class="spec-box">
              <span class="spec-lbl">Weight</span>
              <span class="spec-val" id="specWeight">113 kg</span>
            </div>
            <div class="spec-box">
              <span class="spec-lbl">Age</span>
              <span class="spec-val" id="specAge">40 years</span>
            </div>
            <div class="spec-box">
              <span class="spec-lbl">Country</span>
              <span class="spec-val" id="specCountry">🇺🇸 USA</span>
            </div>
          </div>

        </div>
      </section>

      <!-- LOWER DATA SECTION -->
      <section class="bottom-glass-panel">
        
        <!-- LEFT TABLE -->
        <div class="table-section">
          <div class="panel-header">
            <h2 class="panel-title">Games Stats</h2>
            <div class="filter-dropdown">
              <span>By Date</span>
              <i class="bx bx-chevron-down"></i>
            </div>
          </div>

          <div class="table-wrapper">
            <table class="games-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Match</th>
                  <th>Final Score</th>
                  <th>Result</th>
                  <th>PTS</th>
                  <th>REB</th>
                  <th>AST</th>
                  <th>FG%</th>
                </tr>
              </thead>
              <tbody id="gamesTableBody">
                <!-- Dynamically populated -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- RIGHT MATCH CARDS COLUMN -->
        <div class="upcoming-sidebar">
          <div class="tabs-bar">
            <button class="tab-btn active">Live <span class="dot-red"></span></button>
            <button class="tab-btn">Yesterday</button>
            <button class="tab-btn">Today</button>
            <button class="tab-btn">Upcoming</button>
            <button class="tab-btn">Archived</button>
          </div>

          <div class="match-cards-list" id="matchCardsContainer">
            <!-- Dynamically populated -->
          </div>
        </div>

      </section>

    </main>
  </div>

</body>
</html>
