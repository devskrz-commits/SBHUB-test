<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sportsbook Hub - Glassmorphic Sidebar</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    :root {
      --bg-overlay: rgba(10, 15, 26, 0.25);
      --glass-bg: rgba(22, 27, 34, 0.45);
      --glass-bg-hover: rgba(255, 255, 255, 0.20);
      --glass-border: rgba(255, 255, 255, 0.22);
      --glass-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      --text-main: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.75);
      --accent-glow: #60a5fa;
      --card-blur: blur(16px);
      --font-mono: 'JetBrains Mono', monospace;
    }

    body.light-mode {
      --bg-overlay: rgba(240, 244, 248, 0.15);
      --glass-bg: rgba(255, 255, 255, 0.40);
      --glass-bg-hover: rgba(255, 255, 255, 0.75);
      --glass-border: rgba(255, 255, 255, 0.5);
      --glass-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
      --text-main: #0f172a;
      --text-sub: #475569;
      --accent-glow: #2563eb;
      --card-blur: blur(20px);
    }

    body {
      min-height: 100vh;
      background-color: #0d1117;
      background-image: linear-gradient(var(--bg-overlay), var(--bg-overlay)), 
                        url('sb-hub.jpg'),
                        url('sb-hub.jpeg'),
                        url('sb-hub.png'),
                        url('https://raw.githubusercontent.com/devskrz-commits/SBHUB-test/main/sb-hub.jpg');
      background-repeat: no-repeat;
      background-position: center center;
      background-attachment: fixed;
      background-size: cover;
      color: var(--text-main);
      display: flex;
      overflow: hidden;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* Glass Sidebar Layout */
    .sidebar {
      position: fixed;
      top: 15px;
      left: 15px;
      height: calc(100vh - 30px);
      width: 250px;
      background: var(--glass-bg);
      backdrop-filter: var(--card-blur);
      -webkit-backdrop-filter: var(--card-blur);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 16px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 100;
      display: flex;
      flex-direction: column;
      box-shadow: var(--glass-shadow);
    }

    /* Collapsed Sidebar State */
    .sidebar.close {
      width: 78px;
    }

    .sidebar .logo-details {
      height: 45px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }

    .sidebar .logo-details .logo_name {
      color: var(--text-main);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.8px;
      opacity: 1;
      transition: opacity 0.3s ease;
      white-space: nowrap;
    }

    .sidebar.close .logo-details .logo_name {
      display: none;
      opacity: 0;
      pointer-events: none;
    }

    .sidebar #btn {
      font-size: 22px;
      cursor: pointer;
      color: var(--text-main);
      transition: all 0.3s ease;
    }

    .sidebar.close .logo-details {
      justify-content: center;
    }

    .sidebar.close #btn {
      margin: 0 auto;
    }

    /* Search Box */
    .sidebar .search-box {
      position: relative;
      height: 42px;
      width: 100%;
      margin-top: 12px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      display: flex;
      align-items: center;
      border: 1px solid var(--glass-border);
      transition: all 0.3s ease;
    }

    .sidebar .search-box i {
      position: absolute;
      left: 0;
      height: 100%;
      width: 46px;
      text-align: center;
      line-height: 42px;
      font-size: 18px;
      color: var(--text-main);
      cursor: pointer;
    }

    .sidebar .search-box input {
      height: 100%;
      width: 100%;
      outline: none;
      border: none;
      background: transparent;
      padding-left: 46px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
    }

    .sidebar.close .search-box input {
      opacity: 0;
      pointer-events: none;
    }

    /* Navigation Items */
    .sidebar .nav-list {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      list-style: none;
      overflow-y: auto;
      max-height: calc(100vh - 190px);
    }

    .sidebar .nav-list::-webkit-scrollbar {
      display: none;
    }

    .sidebar li {
      position: relative;
      list-style: none;
    }

    .sidebar li a {
      display: flex;
      height: 44px;
      width: 100%;
      border-radius: 12px;
      align-items: center;
      text-decoration: none;
      transition: all 0.3s ease;
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
    }

    .sidebar li a:hover, .sidebar li a.active {
      background: var(--glass-bg-hover);
      border-color: var(--glass-border);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .sidebar li i {
      min-width: 46px;
      text-align: center;
      font-size: 18px;
      color: var(--text-main);
    }

    .sidebar li a .links_name {
      color: var(--text-main);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
      white-space: nowrap;
      opacity: 1;
      transition: 0.3s ease;
    }

    .sidebar.close li a .links_name {
      opacity: 0;
      pointer-events: none;
    }

    .sidebar li .tooltip {
      position: absolute;
      top: -20px;
      left: calc(100% + 15px);
      z-index: 3;
      background: var(--glass-bg);
      backdrop-filter: var(--card-blur);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      opacity: 0;
      white-space: nowrap;
      pointer-events: none;
      transition: 0s;
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    .sidebar.close li:hover .tooltip {
      opacity: 1;
      pointer-events: auto;
      transition: all 0.3s ease;
      top: 50%;
      transform: translateY(-50%);
    }

    .sidebar li.profile {
      position: absolute;
      height: 55px;
      width: calc(100% - 32px);
      left: 16px;
      bottom: 16px;
      padding: 10px 12px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.4s ease;
    }

    .sidebar.close li.profile {
      justify-content: center;
      padding: 10px 0;
    }

    .sidebar .profile-details {
      display: flex;
      align-items: center;
    }

    .sidebar li .name_job {
      margin-left: 8px;
      white-space: nowrap;
    }

    .sidebar li .name {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--text-main);
    }

    .sidebar li .job {
      font-size: 9px;
      font-weight: 600;
      color: var(--text-sub);
    }

    .sidebar.close .profile .name_job {
      display: none;
      opacity: 0;
      pointer-events: none;
    }

    /* Main Workspace */
    .main-workspace {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Draggable Glass Cards */
    .draggable-card {
      position: absolute;
      width: 700px;
      max-width: calc(100vw - 140px);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: var(--card-blur);
      -webkit-backdrop-filter: var(--card-blur);
      border-radius: 20px;
      padding: 20px 24px;
      box-shadow: var(--glass-shadow);
      user-select: none;
      z-index: 10;
    }

    .draggable-card:active {
      cursor: grabbing;
    }

    .card-header-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--accent-glow);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--glass-border);
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: grab;
    }

    .card-header-title:active {
      cursor: grabbing;
    }

    .drag-hint {
      font-size: 10px;
      color: var(--text-sub);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      letter-spacing: 0;
    }

    /* Timezone Controls */
    .tz-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .tz-select {
      background: var(--glass-bg);
      color: var(--text-main);
      border: 1px solid var(--glass-border);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }

    .tz-select option {
      background: #0f172a;
      color: #fff;
    }

    .add-tz-btn {
      background: var(--accent-glow);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .add-tz-btn:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }

    .timezone-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .time-card {
      position: relative;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      padding: 12px;
      border-radius: 12px;
      text-align: center;
    }

    .time-card .remove-btn {
      position: absolute;
      top: 4px;
      right: 8px;
      font-size: 12px;
      color: var(--text-sub);
      cursor: pointer;
      font-weight: bold;
    }

    .time-card .remove-btn:hover {
      color: #ef4444;
    }

    .time-card .zone-name {
      font-size: 10px;
      font-weight: 800;
      color: var(--accent-glow);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* Monospace Font for Clocks */
    .time-card .zone-clock {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-main);
    }

    /* Links Grid */
    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }

    .sub-link-item {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      padding: 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      border-radius: 12px;
      text-decoration: none;
      text-align: center;
      transition: all 0.2s ease;
      text-transform: uppercase;
      border: 1px solid var(--glass-border);
    }

    .sub-link-item:hover {
      background: var(--glass-bg-hover);
      color: #ffffff;
      border-color: var(--accent-glow);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    /* Context Menu / Right-Click Custom Menu */
    .custom-context-menu {
      display: none;
      position: fixed;
      background: var(--glass-bg);
      backdrop-filter: var(--card-blur);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 6px;
      z-index: 1000;
      box-shadow: var(--glass-shadow);
      min-width: 160px;
    }

    .custom-context-item {
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-main);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .custom-context-item:hover {
      background: var(--glass-bg-hover);
      color: var(--accent-glow);
    }

    /* Settings Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: var(--card-blur);
      padding: 24px;
      border-radius: 16px;
      width: 340px;
      box-shadow: var(--glass-shadow);
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
    }

    .action-btn {
      width: 100%;
      margin-top: 18px;
      background: var(--accent-glow);
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 22px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.2);
      transition: .3s;
      border-radius: 22px;
      border: 1px solid var(--glass-border);
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #2563eb;
    }

    input:checked + .slider:before {
      transform: translateX(22px);
    }
  </style>
</head>

      <div class="timezone-grid" id="timezoneGrid"></div>
    </div>

    <div class="draggable-card" id="linksCard" style="top: 210px; left: 120px;" oncontextmenu="showContextMenu(event)">
      <div class="card-header-title" oncontextmenu="event.stopPropagation()">
        <span id="activeCategoryTitle">SELECT A CATEGORY</span>
        <span class="drag-hint"><i class='bx bx-move'></i> Drag to move</span>
      </div>
      <div class="links-grid" id="linksGrid"></div>
    </div>

  </div>

  <div class="custom-context-menu" id="contextMenu">
    <div class="custom-context-item" onclick="openAllCurrentLinks()">
      <i class='bx bx-windows' style="font-size: 14px;"></i> Open All in New Tab
    </div>
  </div>

  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <div class="card-header-title">
        <span>SETTINGS</span>
        <i class='bx bx-x' style="cursor:pointer; font-size: 22px;" onclick="toggleModal()"></i>
      </div>

      <div class="setting-row">
        <span style="font-size: 12px; font-weight: 700;">Daylight Mode</span>
        <label class="switch">
          <input type="checkbox" id="modeToggle" onchange="toggleTheme()">
          <span class="slider"></span>
        </label>
      </div>

      <button class="action-btn" id="saveLayoutBtn" onclick="saveLayoutToURL()">
        <i class='bx bx-link-external'></i> SAVE LAYOUT & COPY LINK
      </button>
    </div>
  </div>

          { name: "HANDOVER", url: "handover.html" }
        ]
      }
    ];

    let activeTimezones = [
      { zone: "UTC", name: "UTC / GMT" },
      { zone: "America/New_York", name: "US East (EST)" },
      { zone: "Europe/London", name: "London" }
    ];

    let currentActiveLinks = [];

    const sidebar = document.querySelector(".sidebar");
    const closeBtn = document.querySelector("#btn");
    const navList = document.querySelector("#navList");
    const activeCategoryTitle = document.querySelector("#activeCategoryTitle");
    const linksGrid = document.querySelector("#linksGrid");
    const contextMenu = document.querySelector("#contextMenu");

    function renderSidebar() {
      navList.innerHTML = "";
      menuData.forEach((item, index) => {
        const li = document.createElement("li");
        li.innerHTML = `
          <a onclick="selectCategory(${index})">
            <i class='bx ${item.icon}'></i>
            <span class="links_name">${item.category}</span>
          </a>
          <span class="tooltip">${item.category}</span>
        `;
        navList.appendChild(li);
      });
    }

    function selectCategory(index) {
      const activeData = menuData[index];
      activeCategoryTitle.innerText = activeData.category;
      currentActiveLinks = activeData.subs;
      
      const allLinks = navList.querySelectorAll("a");
      allLinks.forEach((link, i) => {
        if (i === index) link.classList.add("active");
        else link.classList.remove("active");
      });

      renderLinks(currentActiveLinks);
    }

    function renderLinks(linksArr) {
      linksGrid.innerHTML = "";
      if(linksArr.length === 0) {
        linksGrid.innerHTML = `<span style="font-size:12px; color:var(--text-sub);">No matching links found.</span>`;
        return;
      }
      linksArr.forEach(sub => {
        const a = document.createElement("a");
        a.className = "sub-link-item";
        a.innerText = sub.name;
        a.href = sub.url;
        a.target = "_blank"; // Forces links to open in a new tab keeping console open
        linksGrid.appendChild(a);
      });
    }

    function handleSearch() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      if(!query) {
        selectCategory(0);
        return;
      }

      activeCategoryTitle.innerText = `SEARCH RESULTS: "${query.toUpperCase()}"`;
      
      let matchedLinks = [];
      menuData.forEach(cat => {
        cat.subs.forEach(sub => {
          if(sub.name.toLowerCase().includes(query)) {
            matchedLinks.push(sub);
          }
        });
      });

      currentActiveLinks = matchedLinks;
      const allLinks = navList.querySelectorAll("a");
      allLinks.forEach(link => link.classList.remove("active"));
      renderLinks(currentActiveLinks);
    }

    function expandSidebar() {
      sidebar.classList.remove("close");
    }

    // Right-Click Context Menu Logic for "Open All in New Tab"
    function showContextMenu(e) {
      e.preventDefault();
      contextMenu.style.display = "block";
      contextMenu.style.left = `${e.clientX}px`;
      contextMenu.style.top = `${e.clientY}px`;
    }

    function hideContextMenu() {
      contextMenu.style.display = "none";
    }

    function openAllCurrentLinks() {
      hideContextMenu();
      if (currentActiveLinks.length === 0) return;
      
      currentActiveLinks.forEach(sub => {
        if (sub.url && sub.url !== "#") {
          window.open(sub.url, '_blank');
        } else {
          window.open('#', '_blank');
        }
      });
    }

    function addTimezone() {
      if (activeTimezones.length >= 3) {
        alert("Maximum of 3 timezone clocks allowed at once. Please remove one first.");
        return;
      }

      const picker = document.getElementById("tzPicker");
      const [zone, name] = picker.value.split("|");

      if (activeTimezones.some(tz => tz.zone === zone)) {
        alert("This timezone is already displayed.");
        return;
      }

      activeTimezones.push({ zone, name });
      updateClocks();
    }

    function removeTimezone(index) {
      activeTimezones.splice(index, 1);
      updateClocks();
    }

    function updateClocks() {
      const grid = document.getElementById("timezoneGrid");
      grid.innerHTML = "";

      if(activeTimezones.length === 0) {
        grid.innerHTML = `<span style="font-size:11px; color:var(--text-sub); grid-column: span 3; text-align: center;">No timezones selected. Add one using the menu above.</span>`;
        return;
      }

      activeTimezones.forEach((tz, index) => {
        const now = new Date();
        const timeString = now.toLocaleTimeString("en-US", {
          timeZone: tz.zone,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        });

        const card = document.createElement("div");
        card.className = "time-card";
        card.innerHTML = `
          <span class="remove-btn" onclick="removeTimezone(${index})">✕</span>
          <div class="zone-name">${tz.name}</div>
          <div class="zone-clock">${timeString}</div>
        `;
        grid.appendChild(card);
      });
    }

    function toggleModal() {
      const modal = document.getElementById("settingsModal");
      modal.style.display = (modal.style.display === "flex") ? "none" : "flex";
    }

    function toggleTheme() {
      const isLight = document.getElementById("modeToggle").checked;
      if (isLight) {
        document.body.classList.add("light-mode");
      } else {
        document.body.classList.remove("light-mode");
      }
    }

    function saveLayoutToURL() {
      const tzCard = document.getElementById("timezonesCard");
      const linksCard = document.getElementById("linksCard");

      const layoutData = {
        tzTop: tzCard.offsetTop,
        tzLeft: tzCard.offsetLeft,
        lkTop: linksCard.offsetTop,
        lkLeft: linksCard.offsetLeft
      };

      localStorage.setItem("sbhub_layout", JSON.stringify(layoutData));

      const params = new URLSearchParams(window.location.search);
      params.set("tzTop", layoutData.tzTop);
      params.set("tzLeft", layoutData.tzLeft);
      params.set("lkTop", layoutData.lkTop);
      params.set("lkLeft", layoutData.lkLeft);

      const shareableURL = `${window.location.origin}${window.location.pathname}?${params.toString()}`;
      window.history.replaceState({}, '', shareableURL);

      navigator.clipboard.writeText(shareableURL).then(() => {
        const btn = document.getElementById("saveLayoutBtn");
        btn.innerHTML = "<i class='bx bx-check'></i> COPIED TO CLIPBOARD!";
        setTimeout(() => {
          btn.innerHTML = "<i class='bx bx-link-external'></i> SAVE LAYOUT & COPY LINK";
        }, 2000);
      });
    }

    function restoreLayoutFromStorage() {
      const params = new URLSearchParams(window.location.search);
      let tzTop = params.get("tzTop");
      let tzLeft = params.get("tzLeft");
      let lkTop = params.get("lkTop");
      let lkLeft = params.get("lkLeft");

      if (!tzTop || !tzLeft) {
        const saved = localStorage.getItem("sbhub_layout");
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            tzTop = parsed.tzTop;
            tzLeft = parsed.tzLeft;
            lkTop = parsed.lkTop;
            lkLeft = parsed.lkLeft;
          } catch(e) {}
        }
      }

      if (tzTop && tzLeft) {
        const tzCard = document.getElementById("timezonesCard");
        tzCard.style.top = `${tzTop}px`;
        tzCard.style.left = `${tzLeft}px`;
      }

      if (lkTop && lkLeft) {
        const linksCard = document.getElementById("linksCard");
        linksCard.style.top = `${lkTop}px`;
        linksCard.style.left = `${lkLeft}px`;
      }
    }

    let zIndexCounter = 10;

    function makeElementDraggable(element) {
      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

      element.onmousedown = function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'A') {
          return;
        }

        e.preventDefault();
        zIndexCounter++;
        element.style.zIndex = zIndexCounter;

        pos3 = e.clientX;
        pos4 = e.clientY;

        document.onmouseup = closeDragElement;
        document.onmousemove = elementDrag;
      };

      function elementDrag(e) {
        e.preventDefault();
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;

        element.style.top = (element.offsetTop - pos2) + "px";
        element.style.left = (element.offsetLeft - pos1) + "px";
      }

      function closeDragElement() {
        document.onmouseup = null;
        document.onmousemove = null;
        
        const tzCard = document.getElementById("timezonesCard");
        const linksCard = document.getElementById("linksCard");
        const layoutData = {
          tzTop: tzCard.offsetTop,
          tzLeft: tzCard.offsetLeft,
          lkTop: linksCard.offsetTop,
          lkLeft: linksCard.offsetLeft
        };
        localStorage.setItem("sbhub_layout", JSON.stringify(layoutData));
      }
    }

    document.querySelectorAll(".draggable-card").forEach(makeElementDraggable);

    closeBtn.addEventListener("click", () => {
      sidebar.classList.toggle("close");
    });

    renderSidebar();
    selectCategory(0);
    updateClocks();
    restoreLayoutFromStorage();
    setInterval(updateClocks, 1000);
  </script>
</body>
</html>
