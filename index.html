<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marcus Huntington - Basketball Player Profile</title>
  
  <!-- Google Fonts & Boxicons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  
  <!-- Project Stylesheet -->
  <link rel="stylesheet" href="./styles.css">

  <!-- External JS Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  
  <!-- Project App JS -->
  <script src="./app.js" defer></script>
</head>
<body id="pageBody">

  <!-- CANVAS FOR BACKGROUND PLASMA EFFECT -->
  <canvas id="bgCanvas"></canvas>

  <!-- SECURITY LOGIN OVERLAY MODAL -->
  <div id="authOverlay">
    <div class="login-container">
      <div class="sitting-robot-stage" id="sittingRobotStage">
        <div class="robot-body-wrapper" id="robotBodyWrapper">
          <div class="robot-antenna"></div>
          <div class="robot-head" id="robotHead">
            <div class="robot-visor">
              <div class="robot-eye" id="leftEye"></div>
              <div class="robot-eye" id="rightEye"></div>
            </div>
          </div>
          <div class="robot-torso"></div>
          <div class="robot-leg left"></div>
          <div class="robot-leg right"></div>
          <div class="robot-hand left"></div>
          <div class="robot-hand right"></div>
        </div>
      </div>

      <div class="login-card" id="loginCard">
        <div class="login-title">Security Gateway</div>
        <div class="login-subtitle">SPORTSBOOK HUB OPERATIONAL PORTAL</div>
        
        <form class="login-input-group" onsubmit="handleLogin(event)">
          <div class="field-wrapper">
            <label class="login-label" for="usernameInput">Username or email</label>
            <input type="text" id="usernameInput" class="login-input" value="sportsbook2026" required autocomplete="username">
          </div>

          <div class="field-wrapper">
            <div class="field-label-row">
              <label class="login-label" for="passwordInput">Security Key</label>
              <a href="#forgot" class="forgot-link">Forgot key?</a>
            </div>
            <div class="password-field-wrap">
              <input type="password" id="passwordInput" class="login-input" value="" placeholder="Enter password" required autocomplete="current-password">
              <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility()" aria-label="Toggle Password Visibility">
                <i class="bx bx-show" id="togglePassIcon"></i>
              </button>
            </div>
          </div>

          <div class="remember-row">
            <input type="checkbox" id="rememberMe" checked>
            <label for="rememberMe">Maintain active session</label>
          </div>

          <div class="login-error" id="loginErrorMsg"></div>

          <button type="submit" class="login-btn">
            <i class="bx bx-key"></i> ACCESS DASHBOARD
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- MAIN DASHBOARD CONTAINER -->
  <div id="dashboardApp" class="dashboard-viewport">
    <main class="main-dashboard-card">

      <!-- REAL ATHLETE IMAGE OVERLAPPING DASHBOARD -->
      <div class="player-cutout-container">
        <img 
          src="https://images.unsplash.com/photo-1546519638-68e109498ffc?auto=format&fit=crop&w=1000&q=80" 
          id="playerHeroImg" 
          alt="Basketball Player Holding Basketball" 
          class="player-hero-img"
        >
      </div>

      <!-- HEADER NAVIGATION -->
      <header class="dashboard-header">
        <div class="brand-logo-area">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
            <path d="M14 3h7v7"/>
            <path d="M3 14h7v7"/>
          </svg>
        </div>

        <div class="header-nav-pills">
          <button class="nav-pill-btn" title="Overview"><i class="bx bx-file-blank"></i></button>
          <button class="nav-pill-btn" title="Roster"><i class="bx bx-group"></i></button>
          <button class="nav-pill-btn active" title="Stats"><i class="bx bx-run"></i></button>
          <button class="nav-pill-btn" title="Schedule"><i class="bx bx-basketball"></i></button>
          <button class="nav-pill-btn" title="Analytics"><i class="bx bx-slider-alt"></i></button>
        </div>

        <div class="header-tools-right">
          <div class="search-field-wrap">
            <i class="bx bx-search"></i>
            <input type="text" id="globalSearchInput" placeholder="Search..">
          </div>
          <div class="user-avatar-pill" onclick="handleLogout()" title="Click to Lock Session">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80" alt="User Profile">
          </div>
        </div>
      </header>

      <!-- UPPER HERO SECTION -->
      <section class="hero-section-grid">
        <div class="player-left-spacer"></div>

        <!-- CENTER RADAR SPIDER CHART & WATERMARK 23 -->
        <div class="spider-chart-stage">
          <div class="jersey-watermark-23">23</div>

          <svg class="radar-chart-svg" viewBox="0 0 300 260">
            <polygon points="150,20 255,80 230,195 70,195 45,80" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
            <polygon points="150,55 220,95 203,170 97,170 80,95" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
            <polygon points="150,90 185,110 176,145 124,145 115,110" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

            <line x1="150" y1="120" x2="150" y2="20" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
            <line x1="150" y1="120" x2="255" y2="80" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
            <line x1="150" y1="120" x2="230" y2="195" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
            <line x1="150" y1="120" x2="70" y2="195" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
            <line x1="150" y1="120" x2="45" y2="80" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

            <polygon points="150,32 250,88 220,185 85,180 52,90" fill="rgba(239, 68, 68, 0.22)" stroke="#ef4444" stroke-width="2.5" stroke-linejoin="round"/>

            <circle cx="150" cy="32" r="4.5" fill="#ef4444"/>
            <circle cx="250" cy="88" r="4.5" fill="#ef4444"/>
            <circle cx="220" cy="185" r="4.5" fill="#ef4444"/>
            <circle cx="85" cy="180" r="4.5" fill="#ef4444"/>
            <circle cx="52" cy="90" r="4.5" fill="#ef4444"/>
          </svg>

          <div class="radar-node node-ppg"><span class="node-label">PPG</span><span class="node-val" id="valPPG">29.1</span></div>
          <div class="radar-node node-apg"><span class="node-label">APG</span><span class="node-val" id="valAPG">10.3</span></div>
          <div class="radar-node node-fg"><span class="node-label">FG%</span><span class="node-val" id="valFG">57.5</span></div>
          <div class="radar-node node-3p"><span class="node-label">3P%</span><span class="node-val" id="val3P">41.0</span></div>
          <div class="radar-node node-rpg"><span class="node-label">RPG</span><span class="node-val" id="valRPG">24.6</span></div>
        </div>

        <!-- RIGHT SIDE PLAYER METRICS BLOCK -->
        <div class="player-info-column">
          <div class="player-title-header">
            <h1 class="player-display-name" id="playerName">Marcus<br>Huntington</h1>
            <div class="team-subrow">
              <i class="bx bxs-shield-alt-2 team-shield-icon"></i>
              <span id="playerTeam">Liberty Deer</span>
            </div>
          </div>

          <!-- TOP 3 STAT CARDS -->
          <div class="top-stat-cards-row">
            <div class="metric-card card-orange">
              <i class="bx bx-trophy card-icon"></i>
              <span class="card-label">Wins</span>
              <span class="card-val" id="statWins">84</span>
            </div>
            <div class="metric-card card-glass">
              <i class="bx bx-basketball card-icon"></i>
              <span class="card-label">Losses</span>
              <span class="card-val" id="statLosses">18</span>
            </div>
            <div class="metric-card card-white">
              <i class="bx bx-star card-icon"></i>
              <span class="card-label">Winning %</span>
              <span class="card-val" id="statWinRate">82.3%</span>
            </div>
          </div>

          <!-- BOTTOM 2x2 SPECIFICATIONS GRID -->
          <div class="specs-grid">
            <div class="spec-card">
              <span class="spec-label">Height</span>
              <span class="spec-val" id="specHeight">2.06 m</span>
            </div>
            <div class="spec-card">
              <span class="spec-label">Weight</span>
              <span class="spec-val" id="specWeight">113 kg</span>
            </div>
            <div class="spec-card">
              <span class="spec-label">Age</span>
              <span class="spec-val" id="specAge">40 years</span>
            </div>
            <div class="spec-card">
              <span class="spec-label">Country</span>
              <span class="spec-val" id="specCountry">🇺🇸 USA</span>
            </div>
          </div>

        </div>
      </section>

      <!-- LOWER DATA SECTION -->
      <section class="lower-glass-panel">
        
        <!-- LEFT GAMES STATS TABLE -->
        <div class="games-table-column">
          <div class="panel-header-row">
            <h2 class="panel-heading">Games Stats</h2>
            <div class="panel-dropdown-filter">
              <span>By Date</span>
              <i class="bx bx-chevron-down"></i>
            </div>
          </div>

          <div class="table-responsive-container">
            <table class="games-data-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Match</th>
                  <th>Final Score</th>
                  <th>Result</th>
                  <th>PTS</th>
                  <th>REB</th>
                  <th>AST</th>
                  <th>FG%</th>
                </tr>
              </thead>
              <tbody id="gamesTableBody">
                <!-- Rendered dynamically by app.js -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- RIGHT UPCOMING / LIVE GAMES COLUMN -->
        <div class="upcoming-sidebar-column">
          <div class="sidebar-tabs-bar">
            <button class="sidebar-tab active">Live <span class="red-live-dot"></span></button>
            <button class="sidebar-tab">Yesterday</button>
            <button class="sidebar-tab">Today</button>
            <button class="sidebar-tab">Upcoming</button>
            <button class="sidebar-tab">Archived</button>
          </div>

          <div class="sidebar-cards-list" id="sidebarMatchCards">
            <!-- Rendered dynamically by app.js -->
          </div>
        </div>

      </section>

    </main>
  </div>

</body>
</html>
